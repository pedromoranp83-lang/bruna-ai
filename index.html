<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08051a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bruna">
<title>Bruna — Assistente Proativa</title>
<style>
:root{--mic-off:#8057e8;--mic-on:#ed356f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#08051a}
body{height:100vh;height:100dvh;touch-action:manipulation;font-family:Arial,system-ui,sans-serif}
#scene{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 42%,#1c1742 0%,#10102b 38%,#08091b 72%,#050611 100%)}
#scene:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 17% 19%,#dfe8ff9c 99%,transparent),radial-gradient(1px 1px at 81% 27%,#b8d7ff80 99%,transparent),radial-gradient(1px 1px at 29% 76%,#ffffff70 99%,transparent),radial-gradient(1px 1px at 73% 84%,#c6aaff70 99%,transparent),radial-gradient(1.5px 1.5px at 54% 13%,#ffffff75 99%,transparent);opacity:.42}
#ambient{position:absolute;left:50%;top:50%;width:min(94vmin,520px);height:min(94vmin,520px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(113,79,255,.25) 0%,rgba(76,135,255,.12) 39%,rgba(206,76,255,.07) 56%,transparent 72%);filter:blur(24px)}
#orb{position:absolute;left:50%;top:50%;width:min(84vmin,430px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(183,197,255,.23);background:radial-gradient(circle at 36% 27%,rgba(255,255,255,.17),transparent 24%),radial-gradient(circle at 50% 52%,rgba(27,39,79,.76) 0%,rgba(15,17,49,.78) 52%,rgba(9,10,29,.9) 77%);box-shadow:inset 0 0 44px rgba(157,156,255,.09),0 0 65px rgba(111,83,255,.16)}
#orb:before,#orb:after{content:"";position:absolute;inset:7%;border:1px solid rgba(107,212,255,.18);border-top-color:rgba(130,228,255,.62);border-left-color:rgba(175,126,255,.38);border-radius:50%;box-shadow:0 0 24px rgba(69,181,255,.08)}
#orb:after{inset:17%;border-color:rgba(222,133,255,.16);border-right-color:rgba(236,156,255,.65);border-bottom-color:rgba(100,199,255,.38);box-shadow:inset 0 0 28px rgba(128,106,255,.08)}
body.assistant-speaking #orb{animation:orbPulse 2.1s ease-in-out infinite;box-shadow:inset 0 0 54px rgba(157,156,255,.15),0 0 90px rgba(111,83,255,.32)}
body.assistant-speaking #orb:before{animation:ringRotate 6s linear infinite}
body.assistant-speaking #orb:after{animation:ringRotate 9s linear infinite reverse}
body.assistant-speaking #ambient{animation:glowPulse 2.1s ease-in-out infinite}
body.assistant-listening #orb{animation:orbListen 1.05s ease-in-out infinite;box-shadow:inset 0 0 50px rgba(107,212,255,.16),0 0 82px rgba(72,190,255,.30)}
body.assistant-listening #orb:before{animation:ringRotate 4.5s linear infinite}
body.assistant-listening #orb:after{animation:ringRotate 7s linear infinite reverse}
body.assistant-listening #ambient{animation:glowPulse 1.25s ease-in-out infinite}
body.assistant-thinking #orb{animation:orbThink 2.6s ease-in-out infinite;box-shadow:inset 0 0 50px rgba(181,130,255,.15),0 0 78px rgba(151,92,255,.27)}
body.assistant-thinking #orb:before{animation:ringRotate 9s linear infinite}
body.assistant-thinking #orb:after{animation:ringRotate 12s linear infinite reverse}
body.assistant-thinking #ambient{animation:glowPulse 2.8s ease-in-out infinite}
@keyframes orbPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.035)}}
@keyframes orbListen{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.055)}}
@keyframes orbThink{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.018)}}
@keyframes ringRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes glowPulse{0%,100%{opacity:.78;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
#visualizer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#controlDock{position:absolute;z-index:12;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:5px;max-width:calc(100vw - 18px);padding:6px 8px;border:1px solid rgba(220,220,255,.19);border-radius:26px;background:rgba(12,10,31,.58);box-shadow:0 5px 22px rgba(0,0,0,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.toolButton{width:40px;height:42px;flex:0 0 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid transparent;border-radius:15px;background:transparent;color:rgba(235,235,255,.72);padding:3px;cursor:pointer;touch-action:manipulation}
.toolButton svg{width:19px;height:19px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.toolButton:hover,.toolButton.active{color:#fff;background:rgba(141,116,255,.19);border-color:rgba(182,164,255,.25)}
.toolLabel{font-size:9px;line-height:10px;white-space:nowrap;opacity:.85}
#modeButton{width:50px;flex-basis:50px}
#micButton{position:static;width:42px;height:42px;flex:0 0 42px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;background:rgba(52,34,83,.75);color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0;cursor:pointer;touch-action:manipulation}
#micButton svg{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#micButton.is-on{background:#a92d60e8;box-shadow:0 0 0 4px #ff477b20,0 0 16px #ff477b77}
#micButton.is-error{background:#d28c20e8}
#micButton:focus-visible,.toolButton:focus-visible{outline:2px solid #fff;outline-offset:2px}
#chatPanel,#composeBar,#settingsPanel{position:absolute;z-index:11;border:1px solid rgba(203,194,255,.2);border-radius:17px;background:rgba(11,10,29,.84);box-shadow:0 8px 30px rgba(0,0,0,.38);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#f4f2ff}
#chatPanel{display:none;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 66px);transform:translateX(-50%);width:min(94vw,560px);max-height:min(43dvh,310px);overflow:hidden;flex-direction:column}
#chatPanel.open{display:flex}
body.composer-open #chatPanel.open{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 126px)}
#chatHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;border-bottom:1px solid rgba(220,220,255,.12);font-size:12px}
#chatHeaderActions{display:flex;gap:6px}
.panelAction{border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#eae6ff;padding:5px 8px;font-size:11px;cursor:pointer}
#chatMessages{overflow-y:auto;padding:9px 11px;font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.codeBlock{margin:8px 0;border:1px solid rgba(183,160,255,.22);border-radius:10px;overflow:hidden;background:#070811}.codeBlockTop{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:rgba(145,117,255,.12);color:#bfe8ff;font-size:10px}.copyCodeButton{border:1px solid rgba(255,255,255,.18);border-radius:7px;background:rgba(255,255,255,.08);color:#fff;padding:4px 7px;font-size:10px;cursor:pointer}.codeContent{margin:0;padding:10px;overflow:auto;white-space:pre;word-break:normal;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:#f3f1ff;-webkit-user-select:text;user-select:text}
.chatMessage{margin:0 0 10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
.chatMessage.user{background:rgba(113,89,215,.19)}
.chatSpeaker{display:block;margin-bottom:3px;color:#a9dfff;font-size:10px;letter-spacing:.04em;text-transform:uppercase}
#composeBar{display:none;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 65px);transform:translateX(-50%);width:min(94vw,560px);padding:7px;align-items:flex-end;gap:7px}
body.composer-open #composeBar{display:flex}
#messageInput{flex:1;min-width:0;min-height:40px;max-height:120px;resize:vertical;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(4,5,17,.46);color:#fff;padding:10px;font:13px/1.4 Arial,system-ui,sans-serif;outline:none}
#messageInput::placeholder{color:rgba(230,228,255,.5)}
#sendButton{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(145,117,255,.65);color:#fff;cursor:pointer}
#sendButton svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#settingsPanel{display:none;right:max(12px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 65px);width:min(260px,calc(100vw - 24px));padding:12px}
#settingsPanel.open{display:block}
#settingsPanel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px}
.settingLabel{display:block;margin:9px 0 5px;color:rgba(239,237,255,.8);font-size:11px}
#voiceSelect{width:100%;border:1px solid rgba(255,255,255,.15);border-radius:9px;background:#17132f;color:#fff;padding:8px;font-size:12px}
#speedRange{width:100%;accent-color:#9c84ff}
#speedValue{float:right;color:#a9dfff}

/* === BRUNA PROATIVA — ferramentas, criação e instalação PWA === */
#featurePanel{position:absolute;z-index:14;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,620px);max-height:min(78dvh,620px);overflow:auto;display:none;padding:14px;border:1px solid rgba(203,194,255,.22);border-radius:20px;background:rgba(8,8,24,.94);box-shadow:0 16px 50px rgba(0,0,0,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#f4f2ff}
#featurePanel.open{display:block}.featureHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.featureHeader strong{font-size:14px}.featureClose{border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;padding:5px 9px;cursor:pointer}.featureTabs{display:flex;gap:6px;margin-bottom:10px}.featureTab{flex:1;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.05);color:#ddd;padding:8px;cursor:pointer}.featureTab.active{background:rgba(145,117,255,.28);color:#fff}.featureView{display:none}.featureView.active{display:block}.featureInput,.featureSelect{width:100%;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:rgba(4,5,17,.6);color:#fff;padding:10px;outline:none;font:13px/1.4 Arial,system-ui,sans-serif}.featureInput{min-height:92px;resize:vertical}.featureRow{display:flex;gap:7px;margin-top:8px}.featureRow>*{flex:1}.featurePrimary{border:0;border-radius:11px;background:rgba(145,117,255,.75);color:#fff;padding:10px 12px;cursor:pointer;font-weight:600}.featureSecondary{border:1px solid rgba(255,255,255,.14);border-radius:11px;background:rgba(255,255,255,.06);color:#fff;padding:10px 12px;cursor:pointer}.featureList{display:grid;gap:7px}.featureCard{padding:9px 10px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.04)}.featureCard b{display:block;margin-bottom:3px}.featureSmall{font-size:11px;color:rgba(235,232,255,.65)}.installBanner{position:absolute;z-index:15;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);display:none;align-items:center;gap:8px;width:min(92vw,470px);padding:8px 10px;border:1px solid rgba(191,170,255,.25);border-radius:14px;background:rgba(12,10,31,.82);backdrop-filter:blur(14px);color:#fff;font-size:11px}.installBanner.show{display:flex}.installBanner button{margin-left:auto;border:0;border-radius:9px;background:rgba(145,117,255,.7);color:#fff;padding:6px 9px;cursor:pointer}.dropZone{border:1px dashed rgba(174,157,255,.32);border-radius:12px;padding:13px;text-align:center;color:rgba(238,235,255,.72);font-size:11px;cursor:pointer}.dropZone input{display:none}.statusPill{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;background:rgba(109,216,255,.1);color:#a9dfff;font-size:10px}.proactiveButtonOn{background:rgba(65,220,145,.22)!important;border-color:rgba(65,220,145,.5)!important;color:#d9ffe9!important}.proactiveButtonOff{background:rgba(255,255,255,.06)!important;color:#ddd!important}.creativeResult{margin-top:10px;display:grid;gap:8px}.creativeResult img,.creativeResult video{display:block;width:100%;max-height:48vh;object-fit:contain;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#050611}.creativeActions{display:flex;gap:7px}.creativeActions a{flex:1;text-align:center;text-decoration:none}.proactiveButtonOn{background:rgba(65,220,145,.22)!important;border-color:rgba(65,220,145,.5)!important;color:#d9ffe9!important}.proactiveButtonOff{background:rgba(255,255,255,.06)!important;color:#ddd!important}.creativeResult{margin-top:10px;display:grid;gap:8px}.creativeResult img,.creativeResult video{display:block;width:100%;max-height:48vh;object-fit:contain;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#050611}.creativeActions{display:flex;gap:7px}.creativeActions a{flex:1;text-align:center;text-decoration:none}
.brunaToast{position:fixed;z-index:40;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 118px);transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:min(90vw,520px);padding:9px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(12,10,31,.9);color:#fff;font-size:11px;box-shadow:0 8px 28px rgba(0,0,0,.35);transition:opacity .18s ease,transform .18s ease;text-align:center}.brunaToast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){.toolButton{width:36px;flex-basis:36px;height:40px}.toolButton svg{width:18px;height:18px}#modeButton{width:46px;flex-basis:46px}#micButton{width:40px;height:40px;flex-basis:40px}#controlDock{gap:3px;padding:5px 6px}}
@media(prefers-reduced-motion:reduce){body.assistant-speaking #orb,body.assistant-speaking #ambient,body.assistant-listening #orb,body.assistant-listening #ambient,body.assistant-thinking #orb,body.assistant-thinking #ambient{animation-duration:4s}}
</style>
</head>
<body>
<main id="scene" aria-label="Bruna — Assistente Proativa">
  <div id="ambient" aria-hidden="true"></div>
  <div id="orb" aria-hidden="true"></div>
  <canvas id="visualizer" aria-hidden="true"></canvas>

  <section id="chatPanel" aria-label="Conversa da Bruna" aria-live="polite">
    <div id="chatHeader"><strong>Conversa</strong><div id="chatHeaderActions"><button id="clearHistoryButton" class="panelAction" type="button">Limpar</button><button id="closeChatButton" class="panelAction" type="button" aria-label="Fechar conversa">×</button></div></div>
    <div id="chatMessages"></div>
  </section>

  <section id="settingsPanel" role="dialog" aria-label="Definições de voz">
    <header><strong>Voz e velocidade</strong><button id="closeSettingsButton" class="panelAction" type="button" aria-label="Fechar definições">×</button></header>
    <label class="settingLabel" for="voiceSelect">Voz local (pt-BR)</label>
    <select id="voiceSelect" aria-label="Escolher voz local"></select>
    <label class="settingLabel" for="speedRange">Velocidade <span id="speedValue">1,15×</span></label>
    <input id="speedRange" type="range" min="0.75" max="1.5" step="0.05" value="1.15">
    <label class="settingLabel" for="pitchRange">Tom <span id="pitchValue">1,08</span></label>
    <input id="pitchRange" type="range" min="0.7" max="1.5" step="0.05" value="1.08">
    <label class="settingLabel" for="personaSelect">Personalidade</label>
    <select id="personaSelect" class="featureSelect" aria-label="Escolher personalidade">
      <option>Amigável</option><option>Profissional</option><option>Criativa</option><option>Objetiva</option><option>Empreendedora</option>
    </select>
    <button id="proactiveToggle" class="featureSecondary" type="button" style="margin-top:8px">💡 Proativa: desligada</button>
    <button id="installFromSettings" class="featurePrimary" type="button" style="margin-top:8px">📲 Instalar Bruna</button>
  </section>

  <form id="composeBar" aria-label="Escrever mensagem">
    <textarea id="messageInput" rows="1" placeholder="Escreve uma mensagem para a Bruna…"></textarea>
    <button id="sendButton" type="submit" aria-label="Enviar mensagem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"></path></svg></button>
  </form>


  <div id="installBanner" class="installBanner"><span>📲 Instalar a Bruna como aplicação neste dispositivo.</span><button id="installButton" type="button">Instalar</button></div>
  <section id="featurePanel" aria-label="Ferramentas da Bruna">
    <div class="featureHeader"><strong id="featureTitle">Ferramentas da Bruna</strong><button id="featureClose" class="featureClose" type="button">×</button></div>
    <div class="featureTabs">
      <button class="featureTab active" data-view="createView" type="button">Criar</button>
      <button class="featureTab" data-view="projectsView" type="button">Projetos</button>
      <button class="featureTab" data-view="toolsView" type="button">Ferramentas</button>
      <button class="featureTab" data-view="filesView" type="button">Ficheiros</button>
    </div>
    <div id="createView" class="featureView active">
      <div class="featureTabs"><button class="featureTab active" data-create="image" type="button">🖼️ Imagem</button><button class="featureTab" data-create="video" type="button">🎬 Vídeo</button></div>
      <textarea id="creativePrompt" class="featureInput" placeholder="Descreve o que queres criar…"></textarea>
      <div class="featureRow"><select id="creativeFormat" class="featureSelect"><option value="portrait">Vertical</option><option value="landscape">Horizontal</option><option value="square">Quadrado</option></select><button id="creativeGenerate" class="featurePrimary" type="button">Gerar</button></div>
      <div id="creativeStatus" class="statusPill">Sem limite de créditos na interface da Bruna.</div>
      <div id="creativeResult" class="creativeResult" aria-live="polite"></div>
    </div>
    <div id="projectsView" class="featureView"><input id="projectName" class="featureInput" style="min-height:40px" placeholder="Nome do projeto"><textarea id="projectDescription" class="featureInput" placeholder="Descrição / objetivo"></textarea><div class="featureRow"><button id="projectSave" class="featurePrimary" type="button">Guardar projeto</button><button id="projectRefresh" class="featureSecondary" type="button">Atualizar</button></div><div id="projectList" class="featureList" style="margin-top:9px"></div></div>
    <div id="toolsView" class="featureView"><input id="researchInput" class="featureInput" style="min-height:40px" placeholder="Pesquisar um assunto…"><div class="featureRow"><button id="researchButton" class="featurePrimary" type="button">🔎 Pesquisar</button><button id="helpButton" class="featureSecondary" type="button">Comandos</button></div><div class="featureRow"><button id="memoryButton" class="featureSecondary" type="button">🧠 Memória</button><button id="proactiveButton" class="featureSecondary proactiveButtonOff" type="button" aria-pressed="false">💡 Proativa: desligada</button></div><div id="toolsStatus" class="statusPill">Pesquisa pública e memória local disponíveis.</div></div>
    <div id="filesView" class="featureView"><label class="dropZone" for="fileInput">📎 Toca aqui para enviar uma imagem ou documento<input id="fileInput" type="file" accept="image/*,.txt,.md,.csv,.json,.html,.js,.css,.pdf,.doc,.docx"></label><div id="fileStatus" class="statusPill">O ficheiro fica neste navegador até ser enviado para a IA.</div></div>
  </section>
  <div id="brunaToast" class="brunaToast" aria-live="polite"></div>
  <nav id="controlDock" aria-label="Controlos da Bruna">
    <button id="historyButton" class="toolButton" type="button" title="Mostrar conversa" aria-label="Mostrar conversa" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h11v15H8zM5 8H4v13h11v-1M11 9h5M11 13h5M11 17h3"></path></svg><span class="toolLabel">Conversa</span></button>
    <button id="keyboardButton" class="toolButton" type="button" title="Escrever mensagem" aria-label="Escrever mensagem" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 9h.01M10 9h.01M13 9h.01M16 9h.01M7 12h.01M10 12h.01M13 12h.01M16 12h.01M8 15h8"></path></svg><span class="toolLabel">Escrever</span></button>
    <button id="modeButton" class="toolButton" type="button" title="Resposta por voz; mudar para texto" aria-label="Resposta por voz; mudar para texto" aria-pressed="false"><svg id="modeVoiceIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM15 9a5 5 0 0 1 0 6M17.5 6.5a9 9 0 0 1 0 11"></path></svg><svg id="modeTextIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 5h16v12H8l-4 3zM8 9h8M8 13h5"></path></svg><span id="modeLabel" class="toolLabel">Voz</span></button>
    <button id="featuresButton" class="toolButton" type="button" title="Ferramentas e criação" aria-label="Ferramentas e criação" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"></path></svg><span class="toolLabel">Ferramentas</span></button>

  function wiki(query){return new Promise(function(resolve){var q=String(query||"").trim().replace(/\s+/g," ");if(!q){resolve(null);return;}fetch("https://pt.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q.replace(/ /g,"_"))).then(function(r){if(!r.ok)throw new Error("not found");return r.json();}).then(function(d){resolve(d&&d.extract?{title:d.title,text:d.extract,url:d.content_urls&&d.content_urls.desktop&&d.content_urls.desktop.page||""}:null);}).catch(function(){resolve(null);});});}
  function searchPublic(query){var q=query.trim();if(!q){replyLocally("/pesquisar","Diz o que queres pesquisar. Exemplo: /pesquisar inteligência artificial");return;}if(assistantBusy)return;assistantBusy=true;stopRecognition();wiki(q).then(function(result){var reply=result?"🔎 "+result.title+"\n\n"+result.text+"\n\nFonte: "+result.url:"Não encontrei um resumo público para essa pesquisa.";remember("user","/pesquisar "+q);remember("assistant",reply);deliverReply(reply);});}
  function generateIdea(topic){var q=topic.trim()||"inteligência artificial e empreendedorismo";if(assistantBusy)return;assistantBusy=true;stopRecognition();wiki(q).then(function(result){var context=result?"Título: "+result.title+"\nResumo: "+result.text+"\nFonte: "+result.url:"Nenhum resultado público foi encontrado. Não alegue ter feito uma pesquisa com sucesso.";assistantBusy=false;askAssistant("Crie uma ideia prática, original e curta inspirada no tema solicitado. Se houver contexto de pesquisa, deixe claro que é uma sugestão inspirada naquele resumo.",{displayUser:"/ideia "+q,context:context});});}
  function setProactive(on){proactiveEnabled=!!on;writeStore(STORAGE.proactive,proactiveEnabled?"1":"0");if(proactiveEnabled){lastProactiveAt=Date.now();writeStore(STORAGE.lastProactive,String(lastProactiveAt));return "💡 Modo proativo ativado. Enquanto a página estiver aberta, posso iniciar uma sugestão útil de vez em quando.";}return "Modo proativo desligado.";}
  function showHelp(){return "Comandos da Bruna (digita no campo de mensagem):\n/pesquisar assunto — pesquisa um resumo público\n/ideia tema — cria uma ideia com contexto de pesquisa\n/projeto criar Nome | descrição — guarda um projeto\n/projetos — lista projetos\n/projeto apagar número — apaga um projeto\n/lembrar fato — guarda uma memória local\n/memoria — mostra memórias guardadas\n/esquecer número — apaga uma memória\n/personalidade amigável|profissional|criativa|objetiva|empreendedora\n/proativa on|off|status — controla a iniciativa\n/voz on|off — resposta falada/texto\n/tom 0.7 a 1.5 — ajusta o tom da voz\n/imagem descrição — gera uma imagem\n/video descrição — gera um vídeo\n/instalar — instruções para instalar como app\n/apagar dados — apaga os dados locais da Bruna.";}
  function handleCommand(raw){
    var text=raw.trim();if(text.charAt(0)!=="/")return false;
    var m;
    if(/^\/(ajuda|comandos)(\s|$)/i.test(text)){replyLocally(text,showHelp());return true;}
    if((m=text.match(/^\/pesquisar\s*(.*)$/i))){searchPublic(m[1]);return true;}
    if((m=text.match(/^\/ideia\s*(.*)$/i))){generateIdea(m[1]);return true;}
    if(/^\/projetos?\s*$/i.test(text)||/^\/projetos?\s+listar\s*$/i.test(text)){replyLocally(text,listProjects());return true;}
    if((m=text.match(/^\/projeto\s+criar\s+(.+)$/i))){var parts=m[1].split("|");var name=(parts.shift()||"").trim(),description=parts.join("|").trim();if(!name){replyLocally(text,"Inclui um nome. Exemplo: /projeto criar Curso | preparar aulas");return true;}projects.push({name:name.slice(0,100),description:description.slice(0,500),date:new Date().toLocaleString()});if(projects.length>50)projects.shift();saveProjects();replyLocally(text,"✅ Projeto guardado neste aparelho: "+name);return true;}
    if((m=text.match(/^\/projeto\s+apagar\s+(\d+)$/i))){var index=parseInt(m[1],10)-1;if(index<0||index>=projects.length){replyLocally(text,"Não encontrei esse número. Usa /projetos para ver a lista.");return true;}if(window.confirm("Apagar o projeto “"+projects[index].name+"”?")){var removed=projects.splice(index,1)[0];saveProjects();replyLocally(text,"Projeto apagado: "+removed.name);}else replyLocally(text,"Não apaguei o projeto.");return true;}
    if((m=text.match(/^\/lembrar\s+(.+)$/i))){var fact=m[1].trim().slice(0,300);localMemory.push(fact);if(localMemory.length>50)localMemory.shift();writeStore(STORAGE.memory,JSON.stringify(localMemory));replyLocally(text,"🧠 Vou guardar essa memória localmente neste aparelho.");return true;}
    if(/^\/memoria\s*$/i.test(text)){replyLocally(text,localMemory.length?"🧠 Memórias locais:\n"+localMemory.map(function(x,i){return (i+1)+". "+x;}).join("\n"):"Ainda não há memórias guardadas. Usa /lembrar seguido do fato.");return true;}
    if((m=text.match(/^\/esquecer\s+(\d+)$/i))){var mi=parseInt(m[1],10)-1;if(mi<0||mi>=localMemory.length){replyLocally(text,"Não encontrei essa memória. Usa /memoria para ver os números.");return true;}if(window.confirm("Apagar esta memória local?\n\n"+localMemory[mi])){localMemory.splice(mi,1);writeStore(STORAGE.memory,JSON.stringify(localMemory));replyLocally(text,"Memória apagada deste aparelho.");}else replyLocally(text,"Não apaguei a memória.");return true;}
    if((m=text.match(/^\/personalidade\s+(.+)$/i))){var desired=m[1].trim().toLowerCase(),found=null;for(var p=0;p<allowedPersonas.length;p++)if(allowedPersonas[p].toLowerCase()===desired)found=allowedPersonas[p];if(!found){replyLocally(text,"Escolhe: Amigável, Profissional, Criativa, Objetiva ou Empreendedora.");return true;}personality=found;writeStore(STORAGE.personality,personality);replyLocally(text,"Personalidade ajustada para: "+personality+".");return true;}
    if((m=text.match(/^\/proativa\s+(on|off|status)$/i))){var val=m[1].toLowerCase();replyLocally(text,val==="status"?(proactiveEnabled?"Modo proativo está ativado.":"Modo proativo está desligado."):setProactive(val==="on"));return true;}
    if((m=text.match(/^\/voz\s+(on|off|status)$/i))){var v=m[1].toLowerCase();if(v==="status")replyLocally(text,"Resposta por "+(responseMode==="voice"?"voz":"texto")+". Usa o botão Voz/Texto ou /voz on|off.");else{responseMode=v==="on"?"voice":"text";writeStore(STORAGE.mode,responseMode);updateModeButton();replyLocally(text,"Resposta automática por "+(responseMode==="voice"?"voz ativada":"texto ativada")+".");}return true;}
    if((m=text.match(/^\/tom\s+([0-9]+(?:[.,][0-9]+)?)$/i))){var val=parseFloat(m[1].replace(",","."));if(val<0.7||val>1.5){replyLocally(text,"Usa um valor entre 0,7 e 1,5.");return true;}speechPitch=val;writeStore(STORAGE.pitch,String(val));replyLocally(text,"Tom de voz ajustado para "+val.toFixed(2)+". (Depende do suporte da voz instalada.)");return true;}
    if((m=text.match(/^\/imagem\s*(.*)$/i))){var prompt=m[1].trim();if(!prompt){replyLocally(text,"Escreve a descrição depois de /imagem.");return true;}openFeature("createView");creativeType="image";document.querySelectorAll(".featureTab[data-create]").forEach(function(x){x.classList.toggle("active",x.getAttribute("data-create")==="image");});document.getElementById("creativePrompt").value=prompt;document.getElementById("creativeGenerate").textContent="Gerar imagem";requestCreative();return true;}
    if((m=text.match(/^\/video\s*(.*)$/i))){var prompt=m[1].trim();if(!prompt){replyLocally(text,"Escreve a descrição depois de /video.");return true;}openFeature("createView");creativeType="video";document.querySelectorAll(".featureTab[data-create]").forEach(function(x){x.classList.toggle("active",x.getAttribute("data-create")==="video");});document.getElementById("creativePrompt").value=prompt;document.getElementById("creativeGenerate").textContent="Gerar vídeo";requestCreative();return true;}
    if(/^\/apagar\s+dados\s*$/i.test(text)){if(window.confirm("Apagar histórico, memórias e projetos locais da Bruna neste aparelho?")){Object.keys(STORAGE).forEach(function(k){try{localStorage.removeItem(STORAGE[k]);}catch(e){}});window.location.reload();}else replyLocally(text,"Mantive os dados locais.");return true;}
    replyLocally(text,"Não reconheci esse comando. Digita /ajuda para ver os comandos disponíveis.");return true;
  }

  function openFeature(view){featurePanel.classList.add("open");featuresButton.classList.add("active");featuresButton.setAttribute("aria-pressed","true");document.querySelectorAll(".featureView").forEach(function(v){v.classList.toggle("active",v.id===view);});document.querySelectorAll(".featureTabs .featureTab[data-view]").forEach(function(t){t.classList.toggle("active",t.getAttribute("data-view")===view);});}
  function closeFeature(){featurePanel.classList.remove("open");featuresButton.classList.remove("active");featuresButton.setAttribute("aria-pressed","false");}
  function renderProjectCards(){var box=document.getElementById("projectList");if(!projects.length){box.innerHTML='<div class="featureCard">Ainda não tens projetos guardados.</div>';return;}box.innerHTML=projects.slice().reverse().map(function(p,ri){var real=projects.length-1-ri;return '<div class="featureCard"><b>'+escapeHtml(p.name)+'</b><span class="featureSmall">'+escapeHtml(p.description||"")+(p.date?" · "+escapeHtml(p.date):"")+'</span><button class="featureSecondary" data-del-project="'+real+'" type="button" style="margin-top:7px">Apagar</button></div>';}).join("");box.querySelectorAll("[data-del-project]").forEach(function(b){b.addEventListener("click",function(){var i=parseInt(b.getAttribute("data-del-project"),10);if(!isNaN(i)&&projects[i]&&window.confirm("Apagar o projeto “"+projects[i].name+"”?")){projects.splice(i,1);saveProjects();renderProjectCards();}});});}
  function escapeHtml(v){return String(v||"").replace(/[&<>\"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch];});}
  function extractMediaUrl(reply){
    var text=String(reply||"");
    var m=text.match(/https?:\/\/[^\s)"'<>]+/i);
    return m?m[0].replace(/[.,;]+$/,""):null;
  }
  function renderCreativeResult(url,type){
    var box=document.getElementById("creativeResult");
    if(!box)return;
    box.innerHTML="";
    if(!url)return;
    var media;
    if(type==="image"){media=document.createElement("img");media.src=url;media.alt="Imagem gerada pela Bruna";}
    else{media=document.createElement("video");media.src=url;media.controls=true;media.playsInline=true;}
    var actions=document.createElement("div");actions.className="creativeActions";
    var open=document.createElement("a");open.className="featureSecondary";open.href=url;open.target="_blank";open.rel="noopener";open.textContent="Abrir";
    var save=document.createElement("a");save.className="featurePrimary";save.href=url;save.download=type==="image"?"bruna-imagem.png":"bruna-video.mp4";save.textContent="Guardar";
    actions.appendChild(open);actions.appendChild(save);box.appendChild(media);box.appendChild(actions);
  }
  function requestCreative(){
    var prompt=document.getElementById("creativePrompt").value.trim();
    var format=document.getElementById("creativeFormat").value;
    var status=document.getElementById("creativeStatus");
    var result=document.getElementById("creativeResult");
    if(!prompt){status.textContent="Escreve primeiro o que queres criar.";return;}
    if(assistantBusy){status.textContent="A Bruna já está a tratar de outro pedido.";return;}
    result.innerHTML="";
    var type=creativeType==="image"?"image":"video";
    status.textContent="A gerar "+(type==="image"?"a imagem":"o vídeo")+"…";
    assistantBusy=true;stopRecognition();setVisualState("thinking");
    var xhr=new XMLHttpRequest(),done=false;
    function finish(url,reply){
      if(done)return;done=true;assistantBusy=false;setVisualState("idle");
      if(url){
        renderCreativeResult(url,type);
        status.textContent=(type==="image"?"Imagem":"Vídeo")+" gerado com sucesso.";
        remember("user",(type==="image"?"/imagem ":"/video ")+prompt);
        remember("assistant",(type==="image"?"🖼️ Imagem gerada: ":"🎬 Vídeo gerado: ")+url);
        if(responseMode==="voice")speak(type==="image"?"A imagem já está no ecrã, Falcão.":"O vídeo já está no ecrã, Falcão.");
        else{setChatOpen(true);renderHistory();}
        return;
      }
      status.textContent="O serviço de criação não devolveu um ficheiro. O Worker da Bruna precisa da rota de geração de "+type+".";
      var msg=reply||"Não foi possível gerar o ficheiro agora.";
      remember("user",(type==="image"?"/imagem ":"/video ")+prompt);remember("assistant",msg);
      if(responseMode==="voice")speak("Não consegui gerar o ficheiro agora. O estado ficou indicado no ecrã.");
      else{setChatOpen(true);renderHistory();}
    }
    xhr.open("POST",WORKER_URL,true);xhr.timeout=180000;xhr.setRequestHeader("Content-Type","application/json");
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4)return;
      var data=null;try{data=JSON.parse(xhr.responseText);}catch(e){}
      if(xhr.status>=200&&xhr.status<300&&data){
        var url=data.imageUrl||data.image_url||data.videoUrl||data.video_url||data.url||data.file_url||extractMediaUrl(data.reply||data.response||data.text);
        finish(url,data.reply||data.response||data.text);
      }else finish(null,null);
    };
    xhr.onerror=function(){finish(null,null)};xhr.ontimeout=function(){finish(null,null)};
    try{xhr.send(JSON.stringify({action:"generate_"+type,type:type,prompt:prompt,format:format,language:"pt-PT",message:"[CRIAR_"+type.toUpperCase()+"]\nFormato: "+format+"\nPedido: "+prompt}));}catch(e){finish(null,null);}
  }
  function syncPersona(){if(personaSelect){personaSelect.value=personality;}}
  function syncProactive(){
    var label=proactiveEnabled?"💡 Proativa: ATIVADA":"💡 Proativa: DESATIVADA";
    if(proactiveToggle){proactiveToggle.textContent=label;proactiveToggle.classList.toggle("proactiveButtonOn",proactiveEnabled);proactiveToggle.classList.toggle("proactiveButtonOff",!proactiveEnabled);proactiveToggle.setAttribute("aria-pressed",proactiveEnabled?"true":"false");}
    var pb=document.getElementById("proactiveButton");
    if(pb){pb.textContent=label;pb.classList.toggle("proactiveButtonOn",proactiveEnabled);pb.classList.toggle("proactiveButtonOff",!proactiveEnabled);pb.setAttribute("aria-pressed",proactiveEnabled?"true":"false");}
  }
  function showToast(message){if(!brunaToast)return;brunaToast.textContent=message;brunaToast.classList.add("show");window.clearTimeout(showToast._timer);showToast._timer=window.setTimeout(function(){brunaToast.classList.remove("show");},2800);}
  function triggerInstall(){
    if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.then(function(choice){showToast(choice&&choice.outcome==="accepted"?"Bruna instalada. ✓":"Instalação cancelada.");deferredInstallPrompt=null;installBanner.classList.remove("show");}).catch(function(){showToast("Não foi possível abrir a instalação agora.");});return;}
    if(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches){showToast("A Bruna já está instalada como aplicação.");return;}
    installBanner.classList.add("show");
    showToast("No Chrome/Edge: menu ⋮ → Instalar Bruna / Instalar aplicação.");
  }
  function updateVoiceSettings(){speechRate=parseFloat(speedRange.value)||1.15;speedValue.textContent=speechRate.toFixed(2).replace(".",",")+"×";writeStore(STORAGE.rate,String(speechRate));}
  function saveSelectedVoice(){selectedVoice=null;for(var i=0;i<voices.length;i++)if(keyForVoice(voices[i])===voiceSelect.value){selectedVoice=voices[i];break;}if(selectedVoice)writeStore(STORAGE.voice,keyForVoice(selectedVoice));else{try{localStorage.removeItem(STORAGE.voice);}catch(e){}}}

  function on(id,event,handler){var el=document.getElementById(id);if(!el)return null;el.addEventListener(event,handler);return el;}
  on("featuresButton","click",function(){if(featurePanel.classList.contains("open"))closeFeature();else openFeature("createView");});
  on("featureClose","click",closeFeature);
  document.querySelectorAll(".featureTabs .featureTab[data-view]").forEach(function(t){t.addEventListener("click",function(){openFeature(t.getAttribute("data-view"));if(t.getAttribute("data-view")==="projectsView")renderProjectCards();showToast(t.textContent.trim()+" aberto.");});});
  document.querySelectorAll(".featureTabs .featureTab[data-create]").forEach(function(t){t.addEventListener("click",function(){creativeType=t.getAttribute("data-create");document.querySelectorAll(".featureTab[data-create]").forEach(function(x){x.classList.toggle("active",x===t);});document.getElementById("creativeGenerate").textContent=creativeType==="image"?"Gerar imagem":"Gerar vídeo";showToast(creativeType==="image"?"Modo imagem selecionado.":"Modo vídeo selecionado.");});});
  on("creativeGenerate","click",requestCreative);
  on("projectSave","click",function(){var n=document.getElementById("projectName").value.trim(),d=document.getElementById("projectDescription").value.trim();if(!n){showToast("Escreve um nome para o projeto.");return;}projects.push({name:n.slice(0,100),description:d.slice(0,500),date:new Date().toLocaleString()});if(projects.length>50)projects.shift();saveProjects();document.getElementById("projectName").value="";document.getElementById("projectDescription").value="";renderProjectCards();showToast("Projeto guardado. ✓");});
  on("projectRefresh","click",function(){renderProjectCards();showToast("Projetos atualizados.");});
  on("researchButton","click",function(){var q=document.getElementById("researchInput").value.trim();if(q)searchPublic(q);else showToast("Escreve primeiro o que queres pesquisar.");});
  on("helpButton","click",function(){replyLocally("/ajuda",showHelp());});
  on("memoryButton","click",function(){replyLocally("/memoria",localMemory.length?"🧠 Memórias locais:\n"+localMemory.map(function(x,i){return (i+1)+". "+x;}).join("\n"):"Ainda não há memórias guardadas.");});
  on("proactiveButton","click",function(){setProactive(!proactiveEnabled);syncProactive();showToast(proactiveEnabled?"Modo proativo ATIVADO.":"Modo proativo DESATIVADO.");});
  on("fileInput","change",function(){var file=this.files&&this.files[0];if(!file)return;document.getElementById("fileStatus").textContent="📎 "+file.name+" · "+Math.round(file.size/1024)+" KB selecionado.";showToast("Ficheiro selecionado. ✓");});
  if(pitchRange)pitchRange.addEventListener("input",function(){speechPitch=parseFloat(pitchRange.value)||1;if(pitchValue)pitchValue.textContent=speechPitch.toFixed(2).replace(".",",");writeStore(STORAGE.pitch,String(speechPitch));});
  if(personaSelect)personaSelect.addEventListener("change",function(){personality=personaSelect.value;writeStore(STORAGE.personality,personality);showToast("Personalidade: "+personality+".");});
  if(proactiveToggle)proactiveToggle.addEventListener("click",function(){setProactive(!proactiveEnabled);syncProactive();showToast(proactiveEnabled?"Modo proativo ATIVADO.":"Modo proativo DESATIVADO.");});
  if(installButton)installButton.addEventListener("click",triggerInstall);
  if(installFromSettings)installFromSettings.addEventListener("click",triggerInstall);
  if(installDockButton)installDockButton.addEventListener("click",triggerInstall);
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredInstallPrompt=e;installBanner.classList.add("show");showToast("A Bruna está pronta para instalação. ✓");});
  window.addEventListener("appinstalled",function(){deferredInstallPrompt=null;installBanner.classList.remove("show");showToast("Bruna instalada como aplicação. ✓");});
  on("historyButton","click",function(){setChatOpen(!chatPanel.classList.contains("open"));});
  on("keyboardButton","click",function(){setComposerOpen(!document.body.classList.contains("composer-open"));});
  on("modeButton","click",function(){var wasSpeaking=responseMode==="voice"&&(visualActive||(window.speechSynthesis&&window.speechSynthesis.speaking));responseMode=responseMode==="voice"?"text":"voice";writeStore(STORAGE.mode,responseMode);updateModeButton();showToast(responseMode==="voice"?"Resposta por voz ATIVADA.":"Resposta por texto ATIVADA.");if(responseMode==="text"){setChatOpen(true);if(wasSpeaking){try{window.speechSynthesis.cancel();}catch(e){}speechToken++;pendingSpeech="";assistantBusy=false;setVisualState("idle");if(micEnabled)window.setTimeout(startRecognition,250);}}});
  on("settingsButton","click",function(){var open=!settingsPanel.classList.contains("open");settingsPanel.classList.toggle("open",open);settingsButton.classList.toggle("active",open);settingsButton.setAttribute("aria-pressed",open?"true":"false");showToast(open?"Definições abertas.":"Definições fechadas.");});
  on("closeSettingsButton","click",function(){settingsPanel.classList.remove("open");settingsButton.classList.remove("active");settingsButton.setAttribute("aria-pressed","false");});
  on("closeChatButton","click",function(){setChatOpen(false);});
  on("clearHistoryButton","click",function(){if(window.confirm("Limpar o histórico da conversa da Bruna neste aparelho?")){conversationHistory=[];persistHistory();renderHistory();showToast("Histórico limpo.");}});
  if(composeBar)composeBar.addEventListener("submit",function(event){event.preventDefault();sendTypedMessage();});
  if(messageInput)messageInput.addEventListener("keydown",function(event){if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();sendTypedMessage();}});
  if(speedRange)speedRange.addEventListener("input",updateVoiceSettings);
  if(voiceSelect)voiceSelect.addEventListener("change",function(){saveSelectedVoice();showToast("Voz selecionada.");});
  updateModeButton();
  syncPersona();syncProactive();if(pitchRange)pitchRange.value=String(speechPitch);if(pitchValue)pitchValue.textContent=speechPitch.toFixed(2).replace(".",",");
  on("micButton","click",function(){
    if(pendingSpeech){var waiting=pendingSpeech;pendingSpeech="";speak(waiting);return;}
    micEnabled=!micEnabled;setMicButton();
    if(micEnabled){
      if(!window.isSecureContext && location.protocol!=="file:"){micEnabled=false;setMicButton();micButton.classList.add("is-error");showToast("O microfone precisa de HTTPS.");return;}
      showToast("Microfone ATIVADO. Fala agora.");if(!assistantBusy)startRecognition();
    }else{stopRecognition();setVisualState("idle");showToast("Microfone DESATIVADO.");}
  });
  window.setInterval(function(){if(!proactiveEnabled||document.hidden||assistantBusy||micEnabled)return;var now=Date.now();if(now-lastProactiveAt<45*60*1000)return;if(lastUserActivityAt&&now-lastUserActivityAt<45*60*1000)return;lastProactiveAt=now;writeStore(STORAGE.lastProactive,String(lastProactiveAt));askAssistant("Sugere uma iniciativa curta e útil relacionada aos meus projetos ou interesses. Pode ser uma ideia, uma pergunta ou um próximo passo. Não sejas insistente; não afirmes que viste atividades que não estão disponíveis.",{hidden:true});},5*60*1000);
  renderHistory();
  window.addEventListener("load",function(){if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js").catch(function(){});if(!conversationHistory.length)window.setTimeout(startGreeting,450);});
})();
